name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate site data
        run: node scripts/validate-data.mjs
      - name: Check generated metadata
        run: node scripts/build-meta.mjs --check
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/site-data.js
          for file in scripts/*.mjs; do node --check "$file"; done
